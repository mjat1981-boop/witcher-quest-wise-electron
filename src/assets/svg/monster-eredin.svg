<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="280" fill="#080808"/>
  <defs>
    <radialGradient id="eg" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#eg)"/>
  <!-- frost mist ground -->
  <ellipse cx="200" cy="265" rx="160" ry="18" fill="#1a3a5c" opacity="0.5"/>
  <ellipse cx="200" cy="268" rx="100" ry="10" fill="#2a5a8c" opacity="0.3"/>
  <!-- body/armor -->
  <path d="M170 240 L160 160 L155 120 L165 90 L200 75 L235 90 L245 120 L240 160 L230 240 Z" fill="#1a1a2a" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- cape -->
  <path d="M155 120 Q120 180 115 245 L170 240 L160 160 Z" fill="#3a0808" opacity="0.9"/>
  <path d="M245 120 Q280 180 285 245 L230 240 L240 160 Z" fill="#3a0808" opacity="0.9"/>
  <!-- chest armor detail -->
  <path d="M175 130 L200 120 L225 130 L220 170 L200 178 L180 170 Z" fill="#0a0a1a" stroke="#c9a84c" stroke-width="1"/>
  <path d="M200 120 L200 178" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
  <circle cx="200" cy="148" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- pauldrons -->
  <path d="M155 120 Q140 110 145 95 Q155 85 165 90 L165 120 Z" fill="#1a1a2a" stroke="#c9a84c" stroke-width="1.2"/>
  <path d="M245 120 Q260 110 255 95 Q245 85 235 90 L235 120 Z" fill="#1a1a2a" stroke="#c9a84c" stroke-width="1.2"/>
  <!-- helmet/head -->
  <path d="M175 90 Q175 55 200 48 Q225 55 225 90 L220 95 L200 98 L180 95 Z" fill="#1a1a2a" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- crown spikes -->
  <path d="M180 65 L175 48 L185 58 L190 42 L195 58 L200 44 L205 58 L210 42 L215 58 L225 48 L220 65" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linejoin="round"/>
  <!-- visor glow eyes -->
  <path d="M185 78 L195 78" stroke="#4a8abf" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>
  <path d="M205 78 L215 78" stroke="#4a8abf" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>
  <!-- sword raised right -->
  <line x1="248" y1="240" x2="310" y2="80" stroke="#8ab4d4" stroke-width="3"/>
  <path d="M306 72 L318 84 L312 87 L300 75 Z" fill="#c9a84c"/>
  <rect x="238" y="232" width="22" height="8" rx="2" fill="#c9a84c" transform="rotate(-20 249 236)"/>
  <!-- left hand shield/magic -->
  <path d="M152 145 Q120 130 108 155 Q118 175 152 165 Z" fill="#1a2a3a" stroke="#4a8abf" stroke-width="1.2"/>
  <circle cx="125" cy="153" r="12" fill="none" stroke="#4a8abf" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
  <!-- frost magic particles -->
  <circle cx="95" cy="140" r="2" fill="#4a8abf" opacity="0.7"/>
  <circle cx="105" cy="125" r="1.5" fill="#6aacdf" opacity="0.6"/>
  <circle cx="88" cy="158" r="1" fill="#4a8abf" opacity="0.5"/>
  <circle cx="112" cy="168" r="2" fill="#4a8abf" opacity="0.6"/>
  <!-- title -->
  <text x="200" y="22" text-anchor="middle" font-family="serif" font-size="13" fill="#c9a84c" letter-spacing="4" opacity="0.8">EREDIN</text>
  <line x1="100" y1="27" x2="300" y2="27" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="275" text-anchor="middle" font-family="serif" font-size="9" fill="#7a6030" letter-spacing="2">KING OF THE WILD HUNT</text>
</svg>
